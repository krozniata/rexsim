name: CI

# pull_request, never pull_request_target: a fork's PR runs its own code, so
# it must get a read-only token and no secrets.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # src/term.ts opens libc.dylib when it loads, and the tests import it.
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bunx tsc --noEmit -p .
      - run: bun test
      - run: bun build src/main.ts --compile --outfile bin/rexsim
