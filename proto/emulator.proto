// The subset of the Android emulator's emulator_controller.proto (emulator
// 36.5) that rexsim uses. Field numbers and names must match the emulator's,
// so copy changes from upstream. Empty stands in for google.protobuf.Empty,
// which has the same encoding.

syntax = "proto3";

package android.emulation.control;

service EmulatorController {
  rpc sendKey(KeyboardEvent) returns (Empty) {}
  rpc sendTouch(TouchEvent) returns (Empty) {}
  rpc getStatus(Empty) returns (EmulatorStatus) {}
  rpc getScreenshot(ImageFormat) returns (Image) {}
  rpc streamScreenshot(ImageFormat) returns (stream Image) {}
  rpc setVmState(VmRunState) returns (Empty) {}
}

message Empty {}

message Touch {
  int32 x = 1;
  int32 y = 2;
  int32 identifier = 3;
  int32 pressure = 4;
}

message TouchEvent {
  repeated Touch touches = 1;
  int32 display = 2;
}

message KeyboardEvent {
  enum KeyCodeType {
    Usb = 0;
    Evdev = 1;
    XKB = 2;
    Win = 3;
    Mac = 4;
  }

  enum KeyEventType {
    keydown = 0;
    keyup = 1;
    keypress = 2;
  }

  KeyCodeType codeType = 1;
  KeyEventType eventType = 2;
  int32 keyCode = 3;
  string key = 4;
  string text = 5;
}

message Rotation {
  enum SkinRotation {
    PORTRAIT = 0;
    LANDSCAPE = 1;
    REVERSE_PORTRAIT = 2;
    REVERSE_LANDSCAPE = 3;
  }

  SkinRotation rotation = 1;
  double xAxis = 2;
  double yAxis = 3;
  double zAxis = 4;
}

message ImageFormat {
  enum ImgFormat {
    PNG = 0;
    RGBA8888 = 1;
    RGB888 = 2;
  }

  ImgFormat format = 1;
  Rotation rotation = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 display = 5;
}

message Image {
  ImageFormat format = 1;
  bytes image = 4;
  uint32 seq = 5;
  uint64 timestampUs = 6;
}

message Entry {
  string key = 1;
  string value = 2;
}

message EntryList {
  repeated Entry entry = 1;
}

message EmulatorStatus {
  string version = 1;
  uint64 uptime = 2;
  bool booted = 3;
  EntryList hardwareConfig = 5;
}

message VmRunState {
  enum RunState {
    UNKNOWN = 0;
    RUNNING = 1;
    RESTORE_VM = 2;
    PAUSED = 3;
    SAVE_VM = 4;
    SHUTDOWN = 5;
    TERMINATE = 7;
    RESET = 9;
    INTERNAL_ERROR = 10;
    RESTART = 11;
    START = 12;
    STOP = 13;
  }

  RunState state = 1;
}
